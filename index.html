<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Musik-Archiv</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; }
        .player { background: #1c1c1c; max-width: 500px; margin: 30px auto; padding: 20px; border-radius: 10px; }
        button { background: #1DB954; border: none; padding: 10px; margin: 5px; cursor: pointer; color: #000; }
    </style>
</head>
<body>
<div class="player">
    <h3>🎵 Musik-Archiv</h3>
    <audio id="audio-player" controls></audio>
    <br>
    <button onclick="changeTrack(-1)">⏮</button>
    <button onclick="togglePlay()">Play/Pause</button>
    <button onclick="changeTrack(1)">⏭</button>
</div>
<script>
    // KORRIGIERTE URL
    const baseUrl = "https://githubusercontent.com";
    
    // Die Playlist mit exakten Dateinamen aus dem Repo
    const playlist = [
        "My-Backup/Bon Jovi - American Reckoning.mp3",
        "My-Backup/Roger Cicero, Yvonne Catterfeld - Somethin' Stupid - Studio Version.mp3"
        // ... hier alle weiteren 42 Dateien einfügen ...
    ];

    let currentTrackIndex = 0;
    const player = document.getElementById('audio-player');

    function loadTrack(index) {
        currentTrackIndex = index;
        const songPath = playlist[currentTrackIndex];
        const safePath = songPath.split('/').map(encodeURIComponent).join('/');
        player.src = baseUrl + safePath;
    }

    function togglePlay() { player.paused ? player.play() : player.pause(); }
    function changeTrack(direction) {
        currentTrackIndex = (currentTrackIndex + direction + playlist.length) % playlist.length;
        loadTrack(currentTrackIndex);
        player.play();
    }
    loadTrack(0);
</script>
</body>
</html>
